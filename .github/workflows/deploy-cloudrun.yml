name: Deploy ke Cloud Run (manual)

# Jalur OPSIONAL — jalur utama deploy adalah scripts/deploy-cloudrun.sh
# dari komputer user (lihat README). Workflow ini hanya berjalan bila
# dijalankan manual dari tab Actions, dan butuh secret GCP_SA_KEY
# (JSON service account dengan peran Cloud Build Editor + Cloud Run Admin
# + Service Account User) di GitHub repo.
on:
  workflow_dispatch:
    inputs:
      gcp_project_id:
        description: "Project ID Firebase/GCP"
        required: true
      gcp_region:
        description: "Region Cloud Run"
        required: true
        default: "asia-southeast2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.gcp_project_id }}
      - name: Autentikasi dari secret GCP_SA_KEY
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
      - name: Build & deploy
        env:
          GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
          GCP_REGION: ${{ inputs.gcp_region }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: bash scripts/deploy-cloudrun.sh
